<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Container - 프로젝트명</title>
    <link rel="stylesheet" href="../_shared/fonts.css" />
    <link rel="stylesheet" href="../_shared/style.css" />
    <link rel="stylesheet" href="../_shared/project-detail.css" />
    <link rel="stylesheet" href="../_shared/footer.css" />
  </head>
  <body>
    <!-- 히어로 · Overview · 본문 밴드 · 푸터를 <project-detail> 이 전부 그린다.
         속성 문구만 바꾸고 본문은 아래 .work-container 안에 넣으면 된다.
         | 는 줄바꿈 — 제목류(ko/en/overview-title)는 모바일에서만, overview-text 는 항상. -->
    <project-detail
      client="신한투자증권"
      launch="Aug, 2022"
      hero="img/hero-bg.jpg"
      hero-mobile="img/m-hero-bg.jpg"
      overview-title="해외주식을 위한 소수점 투자 서비스"
      overview-text="신한금융그룹의 서비스를 한 눈에 확인하고 이용할 수 있는 신한플러스 서비스에 국내 최초로 신한투자증권이 해외주식 소수점투자 서비스를 제공하게 되었습니다. 신한플러스의 가이드를 준수하였으며, 생소한 소수점 주식 거래와 다양한 형태의 투자 방식에 대해 이용의 용이성을 높이고, 거래의 편의성을 중심으로 UI/UX를 구현하였습니다."
      platform=""
    >
      <figure class="pd-sec pd-sec--pc">
        <img src="img/sec1.png" alt="" />
      </figure>

      <figure class="pd-sec pd-sec--m">
        <img src="img/m-sec1.png" alt="" />
      </figure>
      <figure class="pd-sec pd-sec--pc">
        <img src="img/sec2.png" alt="" />
      </figure>

      <figure class="pd-sec pd-sec--m">
        <img src="img/m-sec2.png" alt="" />
      </figure>
    </project-detail>

    <script src="/portfolio/_shared/bridge.js"></script>
    <script src="/portfolio/_shared/works.js"></script>
  </body>
</html>
