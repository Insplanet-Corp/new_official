    <!-- 히어로 · Overview · 본문 밴드 · 푸터를 <project-detail> 이 전부 그린다.
         속성 문구만 바꾸고 본문은 아래 .work-container 안에 넣으면 된다.
         | 는 줄바꿈 — 제목류(ko/en/overview-title)는 모바일에서만, overview-text 는 항상. -->
    <project-detail
      client="KB금융그룹"
      launch="Mar, 2022"
      hero="img/hero-bg.jpg"
      hero-mobile="img/m-hero-bg.jpg"

      overview-text="마이데이터 포털은 분석전문가의 업무 효율화를 위한 분석 플랫폼입니다.|축적된 데이터의 분석과 효율적인 관리로 즉각적인 인사이트를 확보하고 맞춤형 서비스를 개발하기 위한 최적화된 데이터분석 환경 조성을 목적으로, 시인성 높은 데이터 시각화와 쉬운 UIUX에 중점을 두고 플랫폼을 구축하였습니다."
      platform=""
