         | 는 줄바꿈 — 제목류(ko/en/overview-title)는 모바일에서만, overview-text 는 항상. -->
    <project-detail

      en="My Homes"

      platform=""

      <figure class="pd-sec pd-sec--pc">

      <figure class="pd-sec pd-sec--m">
