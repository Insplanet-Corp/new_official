<!doctype html>
<html lang="ko">
  <head>

    <title>Work Container - 프로젝트명</title>
    <link rel="stylesheet" href="../_shared/fonts.css" />

    <link rel="stylesheet" href="../_shared/project-detail.css" />

  <body>
    <!-- 히어로 · Overview · 본문 밴드 · 푸터를 <project-detail> 이 전부 그린다.
         속성 문구만 바꾸고 본문은 아래 .work-container 안에 넣으면 된다.
         | 는 줄바꿈 — 제목류(ko/en/overview-title)는 모바일에서만, overview-text 는 항상. -->
    <project-detail
      client="신한금융그룹"
      launch="Jan, 2021"
      hero="img/hero-bg.jpg"
      hero-mobile="img/m-hero-bg.jpg"
      overview-title="신한금융그룹의 모든 서비스, 신한플러스를 통하다"
      overview-text="신한플러스는 신한금융그룹의 모든 서비스 사용자를 위한 혜택 서비스 플랫폼입니다.|인스플래닛은 고객의 다양한 금융환경 대응과 만족도 향상을 위해,신한플러스의 서비스(멤버십, 금융, 혜택) 영역에 대한 접근성을 향상 및 이용 편의성 제고, 교차 거래 활성화를 유도하기 위해 UIUX 컨설팅 및 리뉴얼을 진행하였습니다."
      platform=""
    >
      <figure class="pd-sec">
        <picture>
          <source media="(max-width: 1023px)" srcset="img/m-sec1.png" width="656" height="1200">
          <img src="img/sec1.png" alt="" width="2000" height="1067" loading="lazy" decoding="async"/>
        </picture>
      </figure>
      
      

      <figure class="pd-sec">
        <picture>
          <source media="(max-width: 1023px)" srcset="img/m-sec2.png" width="656" height="984">
          <img src="img/sec2.png" alt="" width="2000" height="1070" loading="lazy" decoding="async"/>
        </picture>
      </figure>
      
      

      <figure class="pd-sec">
        <picture>
          <source media="(max-width: 1023px)" srcset="img/m-sec3.png" width="656" height="960">
          <img src="img/sec3.png" alt="" width="2000" height="1067" loading="lazy" decoding="async"/>
        </picture>
      </figure>
      
      
    </project-detail>

    <script src="/portfolio/_shared/bridge.js"></script>
    <script src="/portfolio/_shared/works.js"></script>
